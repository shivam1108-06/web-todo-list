{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">Edit Task</h2>

<form method="POST">

    <input
        type="text"
        name="task"
        class="form-control mb-3"
        value="{{ task.name }}"
        required
    >

    <button class="btn btn-primary">
        Update Task
    </button>

</form>

{% endblock %}
