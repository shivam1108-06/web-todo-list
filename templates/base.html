<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Todo Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        .hero{
            background:linear-gradient(135deg,#0d6efd,#6610f2);
            color:white;
            padding:40px;
            border-radius:20px;
            text-align:center;
            margin-bottom:30px;
        }

        .card{
            border:none;
            border-radius:15px;
        }

        .table{
            background:white;
        }

        footer{
            text-align:center;
            margin-top:50px;
            color:gray;
        }

    </style>

</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            ✅ Todo Manager
        </a>

    </div>

</nav>

<div class="container mt-4">

    {% block content %}
    {% endblock %}

</div>

<footer>
    <hr>
    <p>© 2026 Shivam Kotak | Todo Manager 🚀</p>
</footer>

</body>
</html>
